name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: 0.41.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.mod
      - name: Go engine (format, vet, test)
        working-directory: engine
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Install TinyGo
        run: |
          curl -fsSL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb
          sudo apt-get install -y binaryen
      - run: pnpm install --frozen-lockfile
      - name: Generated engine files are up to date
        run: |
          pnpm engine:generate
          git diff --exit-code -- engine/raster/blackhole_gen.go tests/fixtures public/sprites
      - run: pnpm engine
      - run: pnpm engine:check
      - run: pnpm content
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  deploy:
    # Hosting: GitHub Pages (chosen 2026-10-27). A custom domain is still open.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # One Pages deployment at a time: merging several PRs in a row queues them instead of
    # failing with "in progress deployment" (28 Oct 2026).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TINYGO_VERSION: 0.41.1
      NEXT_PUBLIC_BASE_PATH: /my-three-body-cv
      NEXT_PUBLIC_SITE_URL: https://skyewalker360.github.io/my-three-body-cv
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.mod
      - name: Install TinyGo
        run: |
          curl -fsSL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb
          sudo apt-get install -y binaryen
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine
      - run: pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
